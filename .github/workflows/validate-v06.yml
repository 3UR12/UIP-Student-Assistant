name: Validate v0.6

on:
  push:
    branches:
      - feature/v0.6-portability-ux-performance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          find extension -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json')); console.log('manifest valid')"
      - name: Run regression suite
        shell: bash
        run: |
          set -e
          for test in tests/*.test.js; do
            echo "==> $test"
            node "$test"
          done
      - name: Diff check
        run: git diff --check HEAD^
