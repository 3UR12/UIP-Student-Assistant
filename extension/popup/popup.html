<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UIP Student Assistant</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>UIP Student Assistant</h1>
        <p>v0.4.0 · Controlled Multi-Module Processor</p>
      </header>
      <p id="status" class="status">Listo para analizar la pestaña actual.</p>
      <button id="scan" type="button">Escanear página actual</button>
      <section id="summary" class="hidden" aria-live="polite"></section>
      <section id="assistant" class="assistant hidden" aria-live="polite">
        <h2>Feedback Assistant</h2>
        <p id="assistant-summary"></p>
        <label for="preference">Valoración preferida</label>
        <select id="preference" disabled><option value="">Sin seleccionar</option></select>
        <button id="prefill" type="button" disabled>Preseleccionar respuestas</button>
        <p id="prefill-status" class="assistant-status"></p>
      </section>
      <section id="submission" class="assistant hidden" aria-live="polite">
        <h2>Envío controlado</h2>
        <p id="submission-summary"></p>
        <button id="review-submit" type="button" disabled>Revisar envío</button>
        <div id="submit-confirmation" class="hidden">
          <p id="submit-confirmation-text"></p>
          <button id="confirm-submit" type="button">Confirmar y enviar</button>
        </div>
        <p id="submit-status" class="assistant-status"></p>
      </section>
      <section id="navigation" class="assistant hidden" aria-live="polite">
        <h2>Navegación detectada</h2>
        <p id="navigation-summary"></p>
        <button id="inspect-navigation" type="button">Revisar navegación</button>
        <button id="continue-navigation" type="button" class="hidden">Continuar</button>
        <p id="navigation-status" class="assistant-status"></p>
      </section>
      <section id="workflow" class="assistant hidden" aria-live="polite">
        <h2>Recorrido de módulos</h2>
        <p id="workflow-summary"></p>
        <div id="workflow-planner" class="hidden">
          <div id="workflow-sections"></div>
          <label for="workflow-preference">Valoración para esta sesión</label>
          <select id="workflow-preference"><option value="">Sin seleccionar</option></select>
          <button id="start-workflow" type="button">Iniciar recorrido</button>
        </div>
        <div id="workflow-feedback"></div>
        <button id="workflow-open" type="button" class="hidden"></button>
        <button id="workflow-return-course" type="button" class="secondary hidden">Volver al curso</button>
        <button id="workflow-cancel" type="button" class="secondary hidden">Cancelar recorrido</button>
        <p id="workflow-status" class="assistant-status"></p>
      </section>
      <details id="details" class="hidden">
        <summary>Detalles detectados</summary>
        <pre id="result"></pre>
      </details>
      <button id="copy" class="secondary hidden" type="button">Copiar diagnóstico sanitizado</button>
    </main>
    <script src="../core/state.js"></script>
    <script src="../core/moodle.js"></script>
    <script src="../core/courses.js"></script>
    <script src="../core/modules.js"></script>
    <script src="../core/activities.js"></script>
    <script src="../core/feedback.js"></script>
    <script src="../core/feedback-form.js"></script>
    <script src="../core/submission.js"></script>
    <script src="../core/navigation.js"></script>
    <script src="../core/workflow-navigation.js"></script>
    <script src="../core/sanitize.js"></script>
    <script src="workflow-session.js"></script>
    <script src="workflow-ui-state.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
